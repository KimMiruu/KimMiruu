<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Irfing Adrian - Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A14"/>
      <stop offset="50%" stop-color="#140E2C"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(180 40) rotate(120) scale(420 330)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1040 250) rotate(-120) scale(400 300)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientTransform="translate(700 20) rotate(90) scale(260 200)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="520" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glowA)"/>
  <rect width="1200" height="280" fill="url(#glowC)"/>
  <rect width="1200" height="280" fill="url(#glowB)"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="1" fill="#FFFFFF">IRFING ADRIAN</text>

  <rect x="518" y="154" width="164" height="4" rx="2" fill="url(#accent)"/>

  <text x="600" y="199" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="2.5" fill="#C4B5FD">FULLSTACK DEVELOPER</text>

  <text x="600" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9AA0BD" letter-spacing="0.6">Backend  ·  Frontend  ·  Database  ·  Cloud Infrastructure</text>

  <g opacity="0.9">
    <rect x="404" y="250" width="392" height="1" fill="url(#accent)" opacity="0.35"/>
  </g>
</svg>