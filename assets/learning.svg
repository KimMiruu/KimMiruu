    <radialGradient id="lglow" cx="0" cy="0" r="1" gradientTransform="translate(90 190) rotate(-110) scale(300 220)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
